name: CI

# The gates every commit has to pass, plus the smoke test that is the only
# defence against a runtime regression breaking every shipped binary
# (plan/distribution.md, "Bun version floor"). Bun is pinned to an exact
# version on purpose: the compiled binary embeds the runtime, so "latest" is
# how a release ships a different runtime than the one that was tested.
#
# `smoke-compile` is not an optional extra. It compiles the host target, copies
# the binary somewhere with no `node_modules` anywhere near it, and runs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `bun run test` is `bun test` plus scripts/check-tests.ts, which fails
      # the run when it discovers zero test files: a green suite that ran
      # nothing is worse than no suite (plan/notes.md).
      - run: bun run test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  smoke-compile:
    name: smoke-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --target bun-linux-x64
      - name: run the binary with no node_modules in sight
        run: |
          set -eu
          work=$(mktemp -d)
          cp dist/chaff-bun-linux-x64 "$work/chaff"
          cd "$work"

          # The version is stamped in by the build from package.json, so the binary has to
          # report exactly that. Asserting equality rather than "not dev" is the stronger
          # check: it also catches the build failing to resolve the file at all.
          expected=$(jq -r .version "$GITHUB_WORKSPACE/package.json")
          version=$(./chaff --version)
          echo "$version"
          case "$version" in
            "chaff $expected ("*) ;;
            *)
              echo "the binary reports '$version', not 'chaff $expected'" >&2
              exit 1
              ;;
          esac

          # The fake client is the only way a compiled binary can be exercised
          # with no Telegram account and no network.
          CHAFF_FAKE=1 ./chaff list --json > list.json
          grep -q '"chats"' list.json
          echo "smoke-compile passed"

      # The installer is the one file whose bug no other job can see: it builds
      # a URL that is only wrong for a pinned tag, and release-smoke only runs
      # at tag time. v0.1.0 shipped broken exactly this way.
      # `releases/download/<tag>/<file>` is the shape; `releases/<tag>/download/
      # <file>` works only for the literal tag "latest". --dry-run makes no
      # network call, so this costs nothing.
      - name: the installer builds GitHub's release URL shape
        run: |
          set -eu
          out=$(sh install.sh --version v1.2.3 --dry-run --dir /tmp/chaff-url-check)
          echo "$out"
          echo "$out" | grep -q 'releases/download/v1\.2\.3/chaff-' || {
            echo "install.sh built the wrong release URL for a pinned tag" >&2
            exit 1
          }
