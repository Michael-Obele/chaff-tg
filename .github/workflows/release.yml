name: Release

# Tagging vX.Y.Z publishes the eight binaries, `checksums.txt` and
# `install.sh` (plan/distribution.md, "CI"). Nothing here runs on a branch: a
# release is a deliberate act, and `release-smoke` re-downloads the published
# artifact over the same public URL a user's `install.sh` would use.
#
# `release` is idempotent so a failed `release-smoke` can be re-run with the
# upload fixed, rather than needing a new tag.
#
# ONE VERSION, ONE PLACE. The version lives in `package.json` and nowhere else, in this
# repo or in the build: `scripts/build.ts` reads that file, and the CLI reads it too, so a
# from-source run and a released binary report the same number. The `gates` job below
# refuses to build when the git tag and `package.json` disagree, which is what makes the
# tag trustworthy; `release-smoke` then asserts the published binary reports it. There is
# deliberately no `--version` flag on the build script: two ways to set one number is one
# way too many.
#
# WHICH COMMIT MESSAGE BUMPS WHAT. Conventional Commits, and the strongest prefix
# in the release window wins:
#
#   fix(...)          patch   0.2.0 -> 0.2.1   a bug fix, no new flag or field
#   feat(...)         minor   0.2.1 -> 0.3.0   a new command, flag, field or doc page
#   feat(...)! or BREAKING CHANGE
#                     minor while 0.x, major from 1.0.0. Before 1.0 the minor
#                     number is the compatibility signal, so a removed or
#                     re-meaning flag is a minor, not a major.
#   chore, docs, test, ci, refactor, perf
#                     no bump on their own; they ride along with the next release
#
# THE RELEASE DANCE, in order:
#
#   1. bump the version in `package.json` (the only place it is written down)
#   2. commit as `chore(release): 0.2.0`
#   3. `git tag v0.2.0`
#   4. push the branch, then push the tag. Pushing the tag is the only step that
#      publishes anything.
#
# The release notes are generated from the commits in the window
# (`--generate-notes`), which is why the commit prefixes above matter twice: they
# decide the bump and they are what the notes are made of.

on:
  push:
    tags: ["v*"]

# One release per tag. Two runs of the same tag would race on `gh release upload`, and
# cancelling a half-finished release is worse than letting it finish, so this waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. The one job that writes is `release`, which says so itself: a
# workflow that can push to the repository because a build step asked it to is a
# permission nobody audited.
permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The whole point of the tag, checked before anything expensive runs: the eight
      # binaries this tag publishes are stamped with `package.json`'s version, so a tag
      # that disagrees with it would ship a release whose `--version` names something
      # nobody can find. Cheapest failure first, and the last one anyone would notice.
      - name: the tag matches package.json, and both are semver
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(jq -r .version package.json)
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$tag_version" | grep -Eq "$semver"; then
            echo "tag $GITHUB_REF_NAME is not semver; tag vX.Y.Z" >&2
            exit 1
          fi
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            echo "bump package.json, commit to main, then move the tag:" >&2
            echo "  git push --delete origin $GITHUB_REF_NAME && git tag -d $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $pkg_version"
      - run: bun install --frozen-lockfile
      # One job rather than three: the three commands take seconds each, and
      # three runners to run them is three checkout-and-install cycles for
      # nothing. CI runs the same three as separate jobs for faster feedback.
      - name: test
        run: bun run test
      - name: typecheck
        run: bun run typecheck
      - name: format
        run: bun run format:check

  build:
    name: build ${{ matrix.target }}
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      # One broken target must not hide the state of the other seven.
      fail-fast: false
      matrix:
        target:
          - bun-linux-x64
          - bun-linux-arm64
          - bun-linux-x64-musl
          - bun-linux-arm64-musl
          - bun-darwin-x64
          - bun-darwin-arm64
          - bun-windows-x64
          - bun-windows-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Every target cross-compiles from this runner; Bun fetches each
      # platform's runtime. When `src/tui` starts importing `@opentui/core`,
      # this install also needs `--os="*" --cpu="*"`, because that library
      # ships one native package per platform and Bun can only embed the ones
      # that are present (plan/distribution.md, "Build script"). Nothing
      # imports it today, so the plain install is enough and much smaller.
      - run: bun install --frozen-lockfile
      # The version needs no passing: `scripts/build.ts` reads `package.json`, which the
      # `gates` job has already proved matches the tag. The commit is passed in rather
      # than read from git, because CI shallow-clones and `github.sha` is the honest
      # answer: it is the commit this tag points at, and what `chaff --version` prints.
      - name: build ${{ matrix.target }}
        env:
          CHAFF_COMMIT: ${{ github.sha }}
        run: bun scripts/build.ts --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: chaff-${{ matrix.target }}
          path: dist/chaff-*
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    # The one job that writes to the repository (see `permissions` at the top).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: .chaff-release
          merge-multiple: true
      # The checksums describe exactly the bytes that were uploaded, so they
      # are written here rather than in a build job that never saw the others.
      - name: write checksums.txt
        run: sh scripts/checksums.sh .chaff-release
      - name: create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" .chaff-release/* install.sh --clobber
          else
            gh release create "$tag" .chaff-release/* install.sh \
              --title "chaff-tg $tag" --generate-notes
          fi

  release-smoke:
    name: release-smoke
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Deliberately no checkout: this job is a user. It downloads the
      # published artifact over the public URL, verifies it against the
      # published checksums, and runs it in an empty directory.
      - name: install the published release the way a user would, then run it
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          artifact="chaff-bun-linux-x64"

          work=$(mktemp -d)
          cd "$work"

          # The published installer, fetched from the release itself. Running it
          # is the point: it is what builds the artifact URL for a pinned tag,
          # and a hand-written curl in this job cannot check that path. It
          # verifies sha256 before writing anything executable.
          curl -fsSL "$base/install.sh" -o install.sh
          sh install.sh --version "$tag" --dir "$work/bin"

          # Independent of the installer: the bytes it installed must match the
          # checksum the release publishes.
          expected=$(curl -fsSL "$base/checksums.txt" | awk -v n="$artifact" '$2 == n { print $1 }')
          actual=$(sha256sum bin/chaff | awk '{ print $1 }')
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

          # The stamp is the whole point of the tag: a released binary has to report the
          # version its release claims, never "dev" and never whatever package.json
          # happened to say at the time. `chaff --version` prints `chaff <version> (<commit>)`.
          reported=$(bin/chaff --version)
          echo "$reported"
          case "$reported" in
            "chaff ${tag#v} ("*) ;;
            *)
              echo "the published binary reports '$reported', not '$tag'" >&2
              exit 1
              ;;
          esac
          CHAFF_FAKE=1 bin/chaff list --json > list.json
          grep -q '"chats"' list.json
          echo "release-smoke passed for $tag"
